# Starts the Kindle dashboard after the Kindle UI is up, if autostart is on in KUAL.
start on started framework
task
script
    [ -f /mnt/us/extensions/dashboard/autostart ] || exit 0
    # Give the home screen time to settle, and leave a window to plug in and fix things.
    sleep 90
    sh /mnt/us/extensions/dashboard/start.sh
end script
